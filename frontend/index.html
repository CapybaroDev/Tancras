<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tancras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="logo" class="logo">
        <h1>Tancras</h1>
    </header>
    <main>
        <div class="criar-post">
            <textarea id="conteudoPost" placeholder="O que está acontecendo?"></textarea>
            <button type="button" id="postarBtn">Postar</button>
        </div>
        <div id="feed"></div>
    </main>

    <nav class="bottom-nav">
        <button id="homeBtn" class="nav-btn active">🏠 Home</button>
        <button id="perfilNavBtn" class="nav-btn">👤 Perfil</button>
        <button id="configNavBtn" class="nav-btn">⚙️ Config</button>
    </nav>

    <div class="modal" id="modalConfig">
        <div class="modal-content">
            <button type="button" class="fechar" id="fecharConfigBtn">X</button>
            <h2>Configurações</h2>
            <button id="sairConfigBtn" class="btn-sair">Sair da conta</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
